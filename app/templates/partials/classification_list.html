{# Partial: classification_list.html
   Context: classifications (List[Classification])
#}
{% from "macros/icons.html" import icon %}

{% if classifications %}
<div class="flex flex-col gap-sm">
    {% for clf in classifications %}
    <div class="classification-row">
        <div class="flex items-center gap-sm">
            <span class="u-bg-dyn clf-swatch" style="--u-bg-color:{{ clf.color }}"></span>
            <span class="fs-base fw-600">{{ clf.name }}</span>
        </div>
        <button name="Delete Classifications" class="btn btn-danger btn-sm py-2xs px-sm fs-xs"
                hx-delete="/api/inventory/classifications/{{ clf.id }}"
                hx-target="#clf-list"
                hx-swap="innerHTML"
                hx-confirm="Delete classification '{{ clf.name }}'? Systems using it will be unclassified."
               >
            {{ icon('trash-2', '11') }}
        </button>
    </div>
    {% endfor %}
</div>
{% else %}
<p class="fs-base text-muted text-center py-md px-0">No classifications defined.</p>
{% endif %}
