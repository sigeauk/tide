{% from "macros/icons.html" import icon, icon_text %}
<!-- Sigma Convert Result Partial -->

{% if success %}
<div class="alert alert-success mb-sm flex items-center justify-between gap-md flex-wrap">
    <div>
        <strong>Conversion ready.</strong>
        Rule modal opens with prefilled values.
    </div>
    {% if prefill_payload %}
    <button name="Open Create Form" type="button"
            class="btn btn-primary btn-sm"
            hx-get="/api/rules/create-form?prefill={{ prefill_payload }}"
            hx-target="#modal-container"
            hx-swap="innerHTML">
        {{ icon_text('plus-circle', 'Open Rule Modal', '14') }}
    </button>
    {% endif %}
</div>

<!-- Store raw query for deployment (original NDJSON) -->
<input name="Raw Query Store" type="hidden" id="raw-query-store" value="{{ raw_query | e }}">

{# Opens the create-rule window with the converted rule (sigma.js). #}
<div hidden data-sigma-prefill="{{ prefill_payload | default('') }}"></div>

{% else %}
<div class="alert alert-danger mb-sm">
    <strong>Conversion Error:</strong><br>
    {{ result }}
</div>
{% endif %}
