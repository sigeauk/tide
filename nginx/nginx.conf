# TIDE Nginx Configuration
# Reverse proxy for FastAPI application

upstream tide_app {
    server tide-app:8000;
    keepalive 32;
}

# This file is included in nginx's http block, so this covers both servers below:
# no nginx version in the Server header or on error pages.
server_tokens off;

server {
    listen 80;
    server_name _;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# ============================================
# HTTPS Server Block (SSL)
# ============================================
server {
    listen 443 ssl http2;
    server_name _;

    # SSL Certificate paths (mount via volume)
    # Use certs placed in ./certs (server.crt / server.key)
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;    # Mozilla intermediate: no X448 or secp521r1
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    # Disabled: issuer certificate not present for self-signed certs
    ssl_stapling off;

    # Request size. nginx's default is 1 MB, which rejects a Management > Data import with
    # "413 Request Entity Too Large" (an export is easily tens of MB). The app itself accepts
    # up to 200 MB, so allow a little more here and give slow uploads time to finish.
    client_max_body_size 256m;
    client_body_timeout 300s;

    # Security headers. nginx gives a location these only when it has no add_header of its own, so
    # a location that sets one (/static/, /) repeats them; keep the copies the same
    # (test/cicd_nginx_headers.py checks). X-XSS-Protection is left out: browsers have dropped it.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # When TIDE itself doesn't answer (starting, restarting, or too slow), a small page with its error
    # code instead of nginx's bare "502 Bad Gateway" (#117). Its words are TIDE's T503 and T504
    # (test/cicd_nginx_headers.py holds them to app/services/errors.py), and its hidden data-tide-error
    # line is what a page script's message reads. Only nginx's own failures: proxy_intercept_errors is
    # off, so TIDE's own answers (a database left unavailable, 503) pass through as they are.
    error_page 502 503 = @tide_down;
    error_page 504 = @tide_slow;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Static files - longer cache for HTTPS
    # Note: nginx does not bind-mount /app/static, so every /static/* request
    # falls through to @backend → uvicorn. The immutable cache headers for
    # the content-hashed bundles under /static/{css,js}/dist/ are applied by
    # FastAPI itself (see app/main.py P4 immutable-cache middleware) so they
    # survive the proxy hop. The 7-day window below is a fallback for the
    # alias path on the off-chance someone wires a static volume in future.
    location /static/ {
        alias /app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Fallback to app if file not found
        try_files $uri @backend;
    }

    # API endpoints
    location /api/ {
        proxy_pass http://tide_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # Timeouts (a large data import is read, parsed and written before it answers)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Elastic APM / RUM intake proxy. Browser code posts to /apm so we keep
    # the RUM agent same-origin and air-gap friendly while forwarding to the
    # local APM intake endpoint exposed by the infra stack.
    location = /apm {
        return 301 /apm/;
    }

    location /apm/ {
        proxy_pass http://host.docker.internal:8200/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Auth endpoints
    location /auth/ {
        proxy_pass http://tide_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    # All other routes (pages)
    location / {
        proxy_pass http://tide_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # Disable proxy caching completely for dynamic pages
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;

        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Fallback for static files
    location @backend {
        proxy_pass http://tide_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # TIDE isn't answering: starting or restarting. The page reloads itself every 10 seconds.
    location @tide_down {
        default_type text/html;
        add_header X-TIDE-Error-Code "T503" always;
        add_header Retry-After "10" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 503 "<!doctype html>
<html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'>
<meta http-equiv='refresh' content='10'><title>Restarting | TIDE</title>
<style>body{margin:0;font-family:sans-serif;background:rgb(15,23,42);color:rgb(226,232,240)}main{max-width:36rem;margin:15vh auto;padding:0 16px}h1{font-size:1.4rem}p{line-height:1.5}.code{color:rgb(148,163,184)}</style></head>
<body><main><h1>TIDE is starting or restarting</h1>
<p>Wait a minute: the page reloads by itself. If TIDE doesn't come back, its log says why (docker compose logs tide-app).</p>
<p class='code'>Error T503</p>
<p hidden data-tide-error='T503'>Could not complete that: TIDE is starting or restarting (T503).</p>
</main></body></html>
";
    }

    # TIDE took the connection but didn't answer within the proxy's time.
    location @tide_slow {
        default_type text/html;
        add_header X-TIDE-Error-Code "T504" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 504 "<!doctype html>
<html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Not answering | TIDE</title>
<style>body{margin:0;font-family:sans-serif;background:rgb(15,23,42);color:rgb(226,232,240)}main{max-width:36rem;margin:15vh auto;padding:0 16px}h1{font-size:1.4rem}p{line-height:1.5}.code{color:rgb(148,163,184)}</style></head>
<body><main><h1>TIDE didn't answer in time</h1>
<p>Try again. If every page hangs, restart TIDE (docker compose restart tide-app).</p>
<p class='code'>Error T504</p>
<p hidden data-tide-error='T504'>Could not complete that: TIDE didn't answer in time (T504).</p>
</main></body></html>
";
    }

    # Health check endpoint
    location /health {
        access_log off;
        default_type text/plain;      # not add_header, so the security headers above still apply
        return 200 "healthy\n";
    }
}
