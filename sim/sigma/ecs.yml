# Simulation ECS: the Sigma pipeline for converting Sigma rules to the fields of a simulation's
# replayed events (sim/README.md), used by the Sigma rules in a scenario's rules.toml.
#
# Windows: pySigma's ECS Windows pipeline (TIDE's built-in "ECS Windows"), item by item, from
# pySigma-backend-elasticsearch 2.1.1 (pySigma 1.5.1): a Windows rule converts to the same query with
# either. Then the sources ECS Windows doesn't cover:
#   webserver  IIS and Splunk Stream http (logs-iis.access-*, logs-network_traffic.http-*)
#   proxy      Splunk Stream http (url.full is the whole address)
#   dns        Splunk Stream dns and Suricata dns
#   firewall   FortiGate (logs-fortinet_fortigate.log-*)
# Index patterns come from the simulation (its own data streams), not from this file.

name: Simulation ECS
priority: 20
allowed_backends:
- elasticsearch
- eql
- lucene
- opensearch
