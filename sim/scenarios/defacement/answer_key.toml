accept = ["aae3f5a29935e6abcc2c2754d12a9af0"]
hints = ["Sysmon's process start event (event.code : 1) keeps the file's hashes in process.hash.*."]

[[question]]
n = 13
points = 200
accept = ["w32/swrort.c!tr", "w32/swrort.c", "swrort.c", "swrort"]
hints = ["The FortiGate keeps its log's subtype in rule.ruleset; its antivirus subtype is virus."]

[[question]]
n = 14
points = 200
accept = ["php-cgi.exe", "php-cgi"]
hints = ["Sysmon on we1149srv: which process started cmd.exe? Look at process.parent.name."]

[[question]]
