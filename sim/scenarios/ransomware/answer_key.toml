# The answer key for questions.md: points, the answers each question accepts, and hints.
# The question text and each answer's write-up stay in questions.md and answers.md.
#
# An answer is compared lower-case, with quotes, backticks and extra spaces taken out. It is right if:
#   accept        it is one of these exactly
#   contains      it holds every one of these (for answers in several parts)
#   contains_any  it holds one of these
#   numbers       its first number is one of these (commas ignored), within tolerance
# Each hint costs a quarter of the question's points when taken, solved or not.

